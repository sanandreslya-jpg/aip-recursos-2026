<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --azul:#1d4ed8; --verde:#16a34a; --borde:#d1d5db; --fondo:#f1f5f9; --rojo:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--fondo); color:#111827; }
  header { background:linear-gradient(120deg,#1e40af,#2563eb 55%,#16a34a); color:#fff; text-align:center; padding:18px 12px; }
  header h1 { margin:0; font-size:26px; letter-spacing:1px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.95; }
  main { max-width:560px; margin:0 auto; padding:12px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; padding:12px; border:0; border-radius:10px; background:#e2e8f0; font-weight:600; font-size:15px; }
  .tabs button.on { background:var(--azul); color:#fff; }
  .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:12px; }
  label { display:block; font-weight:600; font-size:14px; margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  select, input, textarea { width:100%; padding:12px; font-size:16px; border:1px solid var(--borde); border-radius:10px; background:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:10px 12px; border:1px solid var(--borde); border-radius:10px; background:#fff; font-size:14px; text-align:center; }
  .chip.on { background:var(--azul); border-color:var(--azul); color:#fff; }
  .chip.off { opacity:.4; pointer-events:none; text-decoration:line-through; }
  .chip small { display:block; font-size:11px; opacity:.85; }
  .recursos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .recursos .chip { font-size:15px; padding:14px 8px; }
  .recursos .chip .i { font-size:26px; display:block; }
  .stepper { display:flex; align-items:center; gap:14px; }
  .stepper button { width:46px; height:46px; border-radius:50%; border:1px solid var(--borde); background:#fff; font-size:24px; }
  .stepper b { font-size:22px; min-width:40px; text-align:center; }
  .hint { font-size:12px; color:#6b7280; margin-top:4px; }
  .btn { width:100%; margin-top:18px; padding:15px; border:0; border-radius:12px; color:#fff; font-size:17px; font-weight:700;
         background:linear-gradient(90deg,#0f4c81,#16a34a); }
  .btn:disabled { opacity:.5; }
  .msg { padding:12px; border-radius:10px; margin-top:12px; font-size:14px; display:none; }
  .msg.ok { display:block; background:#dcfce7; color:#166534; }
  .msg.err { display:block; background:#fee2e2; color:#991b1b; }
  .res { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 0; border-bottom:1px solid #eee; }
  .res:last-child { border:0; }
  .res button { border:1px solid var(--rojo); color:var(--rojo); background:#fff; border-radius:8px; padding:8px 10px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>SIGAIP</h1>
  <p>Sistema Inteligente de Gestión del Aula de Innovación Pedagógica</p>
  <p style="font-size:12px">I.E.N.° 16210 "Alejandro Sánchez Arteaga"</p>
</header>
<main>
  <div class="tabs">
    <button id="tab1" class="on" onclick="tab(1)">📋 Reservar</button>
    <button id="tab2" onclick="tab(2)">🗓️ Mis reservas</button>
  </div>

  <div class="card">
    <label for="docente">👩‍🏫 Docente</label>
    <select id="docente" onchange="cambioDocente()"><option value="">Cargando…</option></select>
    <div class="hint" id="area"></div>
  </div>

  <section id="v1">
    <div class="card">
      <label>📅 Día (esta semana y la próxima)</label>
      <div class="chips" id="fechas"></div>

      <label>📦 Recurso</label>
      <div class="recursos" id="recursos"></div>

      <label>⏰ Horas (puedes elegir varias)</label>
      <div class="chips" id="bloques"><span class="hint">Elige día y recurso</span></div>

      <div id="bcant" class="hidden">
        <label>🔢 Cantidad</label>
        <div class="stepper"><button onclick="paso(-1)">−</button><b id="cant">1</b><button onclick="paso(1)">+</button></div>
        <div class="hint" id="maxhint"></div>
      </div>

      <label for="grado">🏫 Grado y sección</label>
      <input id="grado" placeholder="Ejemplo: 3° B" autocomplete="off">

      <label for="notas">📝 Requerimientos adicionales (opcional)</label>
      <textarea id="notas" rows="3" placeholder="Ejemplo: internet, cables HDMI…"></textarea>

      <button class="btn" id="enviar" onclick="reservar()">✅ Registrar reserva</button>
      <div id="msg" class="msg"></div>
    </div>
  </section>

  <section id="v2" class="hidden">
    <div class="card" id="lista">Selecciona tu nombre arriba.</div>
  </section>
</main>

<script>
const S = { fecha:null, recurso:null, bloques:[], cant:1, max:1, disp:[], docentes:[], recursos:[] };
const $ = id => document.getElementById(id);
const fmt = f => { const [y,m,d] = f.split('-'); return d+'/'+m; };

google.script.run.withSuccessHandler(init).withFailureHandler(e => mensaje(e.message,'err')).getInit();

function init(d) {
  S.docentes = d.docentes; S.recursos = d.recursos;
  $('docente').innerHTML = '<option value="">Seleccione…</option>' +
    d.docentes.map(x => `<option>${esc(x.nombre)}</option>`).join('');
  const guardado = localStorage.getItem('sigaip_docente');
  if (guardado && d.docentes.some(x => x.nombre === guardado)) { $('docente').value = guardado; cambioDocente(); }
  $('fechas').innerHTML = d.fechas.map(f =>
    `<div class="chip" data-f="${f.fecha}" onclick="setFecha('${f.fecha}')">${f.dia.slice(0,3)}<small>${fmt(f.fecha)}</small></div>`).join('');
  $('recursos').innerHTML = d.recursos.map(r =>
    `<div class="chip" data-r="${esc(r.nombre)}" onclick="setRecurso('${esc(r.nombre)}')"><span class="i">${r.icono}</span>${esc(r.nombre)}<small>${r.total} en total</small></div>`).join('');
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tab(n) {
  $('v1').classList.toggle('hidden', n !== 1); $('v2').classList.toggle('hidden', n !== 2);
  $('tab1').classList.toggle('on', n === 1); $('tab2').classList.toggle('on', n === 2);
  if (n === 2) cargarMias();
}
function cambioDocente() {
  const d = S.docentes.find(x => x.nombre === $('docente').value);
  $('area').textContent = d ? '📚 Área: ' + d.area : '';
  if (d) localStorage.setItem('sigaip_docente', d.nombre);
  if (!$('v2').classList.contains('hidden')) cargarMias();
}
function setFecha(f) { S.fecha = f; marcar('fechas','f',f); cargarDisp(); }
function setRecurso(r) { S.recurso = r; marcar('recursos','r',r); cargarDisp(); }
function marcar(cont, attr, val) {
  [...$(cont).children].forEach(c => c.classList.toggle('on', c.dataset[attr] === val));
}

function cargarDisp() {
  if (!S.fecha || !S.recurso) return;
  S.bloques = []; $('bloques').innerHTML = '<span class="hint">Consultando disponibilidad…</span>';
  google.script.run.withSuccessHandler(d => { S.disp = d; pintarBloques(); })
    .withFailureHandler(e => mensaje(e.message,'err')).getDisponibilidad(S.fecha, S.recurso);
}
function pintarBloques() {
  const unico = S.disp.length && S.disp[0].total === 1;
  $('bloques').innerHTML = S.disp.map(b => {
    const off = b.pasado || b.libres <= 0 || b.esRecreo;
    const txt = b.esRecreo ? 'Recreo' : b.pasado ? 'Ya pasó' : b.libres <= 0 ? 'Ocupado' : unico ? 'Libre' : b.libres + ' libres';
    return `<div class="chip ${off?'off':''} ${S.bloques.includes(b.bloque)?'on':''}" onclick="toggleBloque('${esc(b.bloque)}')">${esc(b.bloque)}<small>${b.inicio}–${b.fin}</small><small>${txt}</small></div>`;
  }).join('');
  const multi = S.disp.length && S.disp[0].total > 1;
  $('bcant').classList.toggle('hidden', !multi);
  recalcularMax();
}
function toggleBloque(n) {
  S.bloques = S.bloques.includes(n) ? S.bloques.filter(x => x !== n) : [...S.bloques, n];
  pintarBloques();
}
function recalcularMax() {
  const sel = S.disp.filter(b => S.bloques.includes(b.bloque));
  S.max = sel.length ? Math.min(...sel.map(b => b.libres)) : (S.disp.length ? Math.max(...S.disp.map(b => b.libres)) : 1);
  if (S.cant > S.max) S.cant = Math.max(S.max, 1);
  $('cant').textContent = S.cant;
  $('maxhint').textContent = 'Máximo disponible en lo que elegiste: ' + S.max;
}
function paso(n) { S.cant = Math.min(Math.max(1, S.cant + n), Math.max(S.max,1)); $('cant').textContent = S.cant; }

function mensaje(t, tipo) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + tipo; m.scrollIntoView({behavior:'smooth', block:'center'}); }

function reservar() {
  const docente = $('docente').value, grado = $('grado').value.trim();
  if (!docente) return mensaje('Selecciona tu nombre.','err');
  if (!S.fecha) return mensaje('Elige un día.','err');
  if (!S.recurso) return mensaje('Elige un recurso.','err');
  if (!S.bloques.length) return mensaje('Elige al menos una hora.','err');
  if (!grado) return mensaje('Indica grado y sección.','err');
  const multi = S.disp[0].total > 1;
  $('enviar').disabled = true;
  google.script.run.withSuccessHandler(() => {
    $('enviar').disabled = false;
    mensaje('¡Reserva registrada! ✅ Puedes verla en "Mis reservas".','ok');
    S.bloques = []; $('grado').value = ''; $('notas').value = ''; cargarDisp();
  }).withFailureHandler(e => { $('enviar').disabled = false; mensaje(e.message,'err'); cargarDisp(); })
    .crearReserva({ docente, fecha:S.fecha, recurso:S.recurso, bloques:S.bloques, cantidad: multi ? S.cant : 1, grado, notas:$('notas').value.trim() });
}

function cargarMias() {
  const d = $('docente').value;
  if (!d) { $('lista').textContent = 'Selecciona tu nombre arriba.'; return; }
  $('lista').textContent = 'Cargando…';
  google.script.run.withSuccessHandler(rs => {
    $('lista').innerHTML = rs.length ? rs.map(r => `<div class="res"><div><b>${esc(r.dia)} ${fmt(r.fecha)}</b> · ${esc(r.bloque)} (${r.inicio}–${r.fin})<br>
      ${esc(r.recurso)} × ${esc(r.cantidad)} · ${esc(r.grado)}</div><button onclick="cancelar('${r.id}')">Cancelar</button></div>`).join('')
      : 'No tienes reservas próximas.';
  }).misReservas(d);
}
function cancelar(id) {
  if (!confirm('¿Cancelar esta reserva?')) return;
  google.script.run.withSuccessHandler(() => { cargarMias(); cargarDisp(); }).cancelarReserva(id, $('docente').value);
}
</script>
</body>
</html>
