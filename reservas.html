<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGAIP SMART · Reserva de recursos</title>
<style>
:root{
  --verde:#14a05f; --verde-osc:#0b5d3b; --verde-med:#1f8a4c; --amarillo:#ffe600; --rojo:#d4202a;
  --bg:#eef4f1; --card:#fff; --txt:#16241c; --muted:#5d6c63; --line:#dbe5df; --line2:#c4d1ca;
  --tint:#e3f4ea; --soft:#f1f6f3; --ytint:#fff3c4; --ytxt:#7a5600; --rtint:#fde0e1; --bad:#c21b25; --grisT:#e8ecea;
  --c-laptops:#2f7de1; --c-proyectores:#8a4fb0; --c-sala:#1b9bd1; --c-parlantes:#6b7a99; --shadow:0 2px 10px #0b5d3b14;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1713; --card:#17211b; --txt:#e6efe9; --muted:#9db0a4; --line:#2a3a31; --line2:#3b4f43;
  --tint:#1d3a2a; --soft:#1e2b23; --ytint:#3d3510; --ytxt:#f0cf55; --rtint:#432225; --bad:#ff7d84; --grisT:#26322b;
  --verde-osc:#14a05f; --c-laptops:#6aa8ff; --c-proyectores:#c295e6; --c-sala:#5cc6f0; --c-parlantes:#9fb0d0; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
.ic{width:1.25em;height:1.25em;flex:none}
header{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:960px;margin:auto;padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:54px;height:54px;border-radius:14px;background:var(--tint);display:grid;place-items:center;flex:none}
.logo img{width:40px;height:40px;object-fit:contain}
h1{margin:0;font-size:1.45rem;letter-spacing:.01em;line-height:1.1}
.brand p{margin:3px 0 0;font-size:.82rem;color:var(--muted)}
.brand small{font-size:.72rem;color:var(--verde-med);font-weight:600}
.mini{display:flex;gap:12px;align-items:flex-end}
.mini div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted)}
.mini i{display:block;width:9px;border-radius:5px;background:var(--verde)}
.mini b{color:var(--txt)}
main{max-width:960px;margin:auto;padding:14px 16px 40px;display:grid;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs button{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:12px 8px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.tabs button .ic{color:var(--verde)}
.tabs button.on{background:var(--verde-osc);border-color:var(--verde-osc);color:#fff}
.tabs button.on .ic{color:#fff}
@media(max-width:520px){.tabs button{flex-direction:column;gap:3px;font-size:.78rem;padding:9px 4px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.sec{font-size:.72rem;font-weight:800;letter-spacing:.08em;color:var(--verde-med);margin-bottom:2px}
h2{margin:14px 0 8px;font-size:1.02rem}
h2:first-of-type{margin-top:4px}
.card>h2:first-child{margin-top:0}
label{display:block;font-size:.8rem;font-weight:700;margin:0 0 4px}
select,input[type=text],input[type=password],input:not([type]),textarea{width:100%;padding:10px;border:1px solid var(--line2);border-radius:10px;font:inherit;background:var(--card);color:var(--txt)}
select:focus,input:focus,textarea:focus,button:focus-visible,.rc:focus-visible{outline:2px solid var(--verde);outline-offset:1px}
select:disabled{opacity:.55}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:620px){.res{grid-template-columns:1fr 1fr}}
.rc{border:2px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px;user-select:none}
.rc .ic{width:2em;height:2em;color:var(--rc)}
.rc b{font-size:.92rem}.rc small{color:var(--muted);font-size:.74rem}
.rc.on{border-color:var(--rc);background:var(--soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 22%,transparent)}
.rc.off{opacity:.45;cursor:not-allowed}
.stp{display:flex;align-items:center;gap:8px;margin-top:4px}
.stp button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font-size:1.2rem;cursor:pointer}
.stp output{min-width:28px;font-weight:800;font-size:1.1rem}
.dias,.weeks{display:flex;gap:8px;flex-wrap:wrap}
.dias button{flex:1;min-width:58px;padding:9px 4px;border:1px solid var(--line2);background:var(--card);color:var(--txt);border-radius:10px;font:inherit;font-weight:700;cursor:pointer;line-height:1.25}
.dias small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.dias button.on{background:var(--verde-osc);border-color:var(--verde-osc);color:#fff}.dias button.on small{color:#fff;opacity:.85}
.dias button:disabled{opacity:.4;cursor:not-allowed}
.weeks{margin-bottom:8px}
.weeks button{border:1px solid var(--line2);background:var(--card);color:var(--txt);padding:7px 12px;border-radius:999px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.weeks button.on{background:var(--tint);border-color:var(--verde);color:var(--verde-osc)}
@media(prefers-color-scheme:dark){.weeks button.on{color:#6fdc9c}}
.aviso{margin-top:10px;background:var(--tint);border-radius:10px;padding:9px 12px;font-size:.85rem}
.obs{margin-top:14px;background:var(--soft);border-radius:12px;padding:12px}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--verde-osc);color:#fff;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.1)}.btn.sec{background:var(--grisT);color:var(--txt)}.btn.red{background:var(--rojo)}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:8px}.btn:disabled{opacity:.45;cursor:not-allowed}
.acts .btn{flex:1;min-width:150px}
.head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.head .ic{width:2.2em;height:2.2em;color:var(--verde)}
.head h2{margin:0}.head p{margin:2px 0 0;font-size:.82rem;color:var(--muted)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.filtros>*{flex:1;min-width:180px}
.chk{display:inline-flex!important;gap:6px;align-items:center;font-weight:600;font-size:.82rem;margin:0 14px 10px 0!important}
.chk input{width:auto}
.tw{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{background:var(--verde-osc);color:#fff;text-align:left;padding:10px;font-size:.8rem}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;background:var(--tint);color:var(--verde-osc)}
.tag.p{background:var(--grisT);color:var(--muted)}.tag.b{background:var(--rtint);color:var(--bad)}
@media(prefers-color-scheme:dark){.tag{color:#6fdc9c}}
.rch{display:inline-flex;gap:5px;align-items:center;margin:0 8px 2px 0;white-space:nowrap}
.rch .ic{color:var(--rc);width:1.15em;height:1.15em}
@media(max-width:700px){
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{padding:10px 12px;border-top:1px solid var(--line)}
  td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  td::before{content:attr(data-l);font-weight:700;color:var(--muted);text-align:left}
  td.empty{display:block;text-align:center}
  td.empty::before{content:none}
}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.82rem;color:var(--muted)}
.pager div{display:flex;gap:6px}
.pager button{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font-weight:700;cursor:pointer}
.pager button.on{background:var(--verde-osc);border-color:var(--verde-osc);color:#fff}.pager button:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media(max-width:620px){.stats{grid-template-columns:1fr}}
.stat{border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;background:var(--tint)}
.stat:nth-child(2){background:#e3effc}.stat:nth-child(3){background:#ece6f8}
@media(prefers-color-scheme:dark){.stat:nth-child(2){background:#1c2b3f}.stat:nth-child(3){background:#2b2440}}
.stat .ic{width:2.4em;height:2.4em;color:var(--verde-med)}.stat:nth-child(2) .ic{color:var(--c-laptops)}.stat:nth-child(3) .ic{color:var(--c-proyectores)}
.stat span{font-size:.8rem;font-weight:700}.stat b{display:block;font-size:1.9rem;line-height:1.1}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.charts{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.box h3{margin:0 0 10px;font-size:.95rem}
.vbars{display:flex;align-items:flex-end;justify-content:space-around;height:170px;border-bottom:1px solid var(--line)}
.vbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-weight:800;font-size:.9rem;flex:1}
.vbars i{display:block;width:min(46px,70%);border-radius:8px 8px 0 0;background:var(--verde)}
.vl{display:flex;justify-content:space-around;font-weight:700;font-size:.82rem;padding-top:6px}.vl span{flex:1;text-align:center}
.hb{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:.88rem;font-weight:600}
.hb .tr{height:9px;background:var(--grisT);border-radius:5px;overflow:hidden;min-width:60px}
.hb .tr i{display:block;height:100%;background:var(--verde);border-radius:5px}
.hb span{display:flex;gap:8px;align-items:center}
.hb .ic{color:var(--rc)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
dialog{background:var(--card);color:var(--txt);border:0;border-radius:14px;padding:18px;width:min(420px,94vw);box-shadow:0 10px 40px #0005}
dialog::backdrop{background:#0006}
dialog h3{margin:0 0 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:92vw;background:var(--verde-osc);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9;text-align:center}
.toast.show{opacity:1}.toast.err{background:var(--rojo)}
.banner{background:var(--ytint);color:var(--ytxt);border-radius:10px;padding:9px 12px;font-size:.82rem}
.foot{text-align:center;font-size:.8rem}.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><span class="logo"><img src="insignia.png" alt="Insignia I.E. 16210"></span>
    <div><h1 id="titulo">SIGAIP SMART 2027</h1><p>I.E.N.° 16210 · Alejandro Sánchez Arteaga</p><small id="sync"></small></div></div>
  <div class="mini" id="mini" aria-label="Reservas de la semana por día"></div>
</div></header>

<main>
  <nav class="tabs" id="tabs">
    <button data-t="nueva" class="on" id="tb-nueva"></button>
    <button data-t="lista" id="tb-lista"></button>
    <button data-t="resumen" id="tb-resumen"></button>
  </nav>
  <div class="banner" id="demo" hidden></div>

  <!-- NUEVA SOLICITUD -->
  <section id="p-nueva" class="card">
    <div class="sec">SOLICITUD DE EQUIPO</div>
    <h2>¿Quién solicita?</h2>
    <div class="g2">
      <div><label for="fArea">Área curricular</label><select id="fArea"></select></div>
      <div><label for="selDoc">Docente</label><select id="selDoc"></select></div>
      <div><label for="fGrado">Grado</label><select id="fGrado"></select></div>
      <div><label for="fSec">Sección</label><select id="fSec"></select></div>
    </div>
    <div id="claveBox" hidden style="margin-top:10px"><label for="clave">Su clave personal</label><input id="clave" type="password" autocomplete="off"></div>

    <h2>¿Qué recurso necesita?</h2>
    <div class="res" id="res"></div>

    <h2>¿Qué día desea reservar?</h2>
    <div class="weeks" id="weeksN"></div>
    <div class="dias" id="dias"></div>

    <h2>¿Qué horario necesita?</h2>
    <div class="g2">
      <div><label for="hIni">Hora de inicio</label><select id="hIni"></select></div>
      <div><label for="hFin">Hora de fin</label><select id="hFin"></select></div>
    </div>
    <div class="aviso" id="aviso" hidden></div>

    <div class="obs"><label for="fNota">Observaciones y requerimientos (opcional)</label><textarea id="fNota" rows="2" maxlength="80" placeholder="Escriba aquí alguna indicación o requerimiento especial..."></textarea></div>
    <div class="acts"><button class="btn" id="btnReg"></button><button class="btn sec" id="btnLimpiar">Limpiar formulario</button></div>
  </section>

  <!-- RESERVAS REGISTRADAS -->
  <section id="p-lista" class="card" hidden>
    <div class="head" id="hdLista"></div>
    <div class="filtros"><input id="qBuscar" placeholder="Buscar por docente, área o recurso..."><select id="qRes"></select></div>
    <label class="chk"><input type="checkbox" id="qMias"> Solo mis reservas</label>
    <label class="chk"><input type="checkbox" id="qPas"> Incluir pasadas</label>
    <div id="admBar" hidden style="margin-bottom:10px"><button class="btn red sm" id="btnBloqAbrir">Bloquear horario</button></div>
    <div class="tw"><table><thead><tr><th>N.°</th><th>Fecha</th><th>Docente</th><th>Área</th><th>Recurso</th><th>Horario</th><th>Estado</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="pager"><span id="pgInfo"></span><div id="pg"></div></div>
  </section>

  <!-- RESUMEN -->
  <section id="p-resumen" class="card" hidden>
    <div class="head" id="hdResumen"></div>
    <div class="weeks" id="weeksR"></div>
    <div class="stats" id="stats"></div>
    <div class="charts"><div class="box"><h3 id="h3dias"></h3><div class="vbars" id="vb"></div><div class="vl" id="vl"></div></div>
      <div class="box"><h3>Recursos más utilizados</h3><div id="hbars"></div></div></div>
  </section>

  <div class="foot"><button id="btnCoord">Acceso coordinación del AIP</button></div>
</main>

<dialog id="dlgPin"><h3>Coordinación del AIP</h3><label for="pin">PIN</label><input id="pin" type="password" autocomplete="off">
  <div class="acts"><button class="btn sec" id="pinNo">Cancelar</button><button class="btn" id="pinOk">Entrar</button></div></dialog>
<dialog id="dlgBloq"><h3>Bloquear horario</h3>
  <div class="g2"><div><label for="bDia">Día</label><select id="bDia"></select></div><div><label for="bMot">Motivo</label><input id="bMot" placeholder="Ej. Evaluación"></div>
  <div><label for="bDesde">Desde</label><select id="bDesde"></select></div><div><label for="bHasta">Hasta</label><select id="bHasta"></select></div></div>
  <div class="acts"><button class="btn sec" id="bNo">Cancelar</button><button class="btn red" id="bOk">Bloquear</button></div></dialog>
<dialog id="dlgConf"><h3 id="cTit">Confirmar</h3><p id="cMsg" style="margin:0"></p>
  <div class="acts"><button class="btn sec" id="cNo">Volver</button><button class="btn red" id="cOk">Sí, continuar</button></div></dialog>
<div class="toast" id="toast"></div>

<script>
const TITULO="SIGAIP SMART 2027";
// URL de la aplicación web de Google Apps Script (apps-script/Code.gs + Reservas.gs). Vacía = modo demostración.
const API="https://script.google.com/macros/s/AKfycbypDLpeaOPwMNW17NCUH8mmU6Ig-bwlrDjbVYxuxOKNrmac5rpWfzBKzg186yhVNGw8/exec";
const DEMO_PIN="1234";

const CAP = { laptops: 35, parlantes: 5, proyectores: 5, sala: 1 };
const ITEMS = ['laptops', 'parlantes', 'proyectores', 'sala'];
const NOMBRES = { laptops: 'laptops', parlantes: 'parlantes', proyectores: 'proyectores', sala: 'sala de cómputo' };
const MAX_BLOQUES = 15; // bloques por docente y por semana
const HORAS = 7;

function addDays(s, n) { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function lunesDe(s) { const d = new Date(s + 'T12:00:00Z'); return addDays(s, -((d.getUTCDay() + 6) % 7)); }
function semanaBase(hoy) { return lunesDe(addDays(hoy, 2)); } // sábado y domingo ya miran la semana siguiente
function usoDe(reservas, fecha, hora) {
  const u = { laptops: 0, parlantes: 0, proyectores: 0, sala: 0 };
  reservas.forEach(r => { if (r.fecha === fecha && +r.hora === +hora) ITEMS.forEach(k => (u[k] += +r[k] || 0)); });
  return u;
}
function validar(reservas, r, hoy) {
  if (!r.docente) return 'Elija su nombre';
  const dow = new Date(r.fecha + 'T12:00:00Z').getUTCDay();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(r.fecha) || dow < 1 || dow > 5) return 'Fecha no válida';
  if (r.fecha < hoy) return 'No se puede reservar en una fecha pasada';
  if (r.fecha > addDays(semanaBase(hoy), 11)) return 'Solo puede reservar esta semana y la siguiente';
  if (!(+r.hora >= 1 && +r.hora <= HORAS)) return 'Hora no válida';
  let total = 0;
  for (const k of ITEMS) {
    const v = +r[k] || 0;
    if (v < 0 || v !== Math.floor(v)) return 'Cantidad no válida';
    total += v;
  }
  if (!total) return 'Elija al menos un recurso';
  const u = usoDe(reservas, r.fecha, r.hora);
  for (const k of ITEMS) {
    if ((+r[k] || 0) > CAP[k] - u[k]) return 'No alcanza: en ese bloque quedan ' + (CAP[k] - u[k]) + ' de ' + NOMBRES[k] + '. Actualice y vuelva a intentar';
  }
  if (!r.bloqueo) {
    if (reservas.some(x => x.docente === r.docente && x.fecha === r.fecha && +x.hora === +r.hora)) return 'Ya tiene una reserva en ese bloque';
    const sem = lunesDe(r.fecha);
    if (reservas.filter(x => x.docente === r.docente && lunesDe(x.fecha) === sem).length >= MAX_BLOQUES) return 'Llegó al máximo de ' + MAX_BLOQUES + ' bloques por semana';
  }
  return null;
}
function validarVarias(reservas, rs, hoy) {
  const acc = reservas.slice();
  for (const r of rs) {
    const e = validar(acc, r, hoy);
    if (e) return e + ' (' + r.hora + '.ª hora)';
    acc.push(r);
  }
  return null;
}
function planBloqueo(reservas, o, hoy) {
  const rows = [];
  for (let h = +o.desde; h <= +o.hasta; h++) {
    const u = usoDe(reservas.concat(rows), o.fecha, h);
    const r = { fecha: o.fecha, hora: h, docente: 'BLOQUEO', area: '', grado: '', nota: o.motivo || 'Bloqueado', bloqueo: true };
    let t = 0;
    ITEMS.forEach(k => { r[k] = CAP[k] - u[k]; t += r[k]; });
    if (!t) continue;
    const e = validar(reservas.concat(rows), r, hoy);
    if (e) return { error: e };
    rows.push(r);
  }
  return { rows: rows };
}


const RORD=["laptops","proyectores","sala","parlantes"];
const NOM={laptops:"Laptop",proyectores:"Proyector",sala:"Sala de Cómputo",parlantes:"Parlante"};
const ICON={
 laptops:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
 proyectores:'<rect x="3" y="7" width="18" height="9" rx="2"/><circle cx="15" cy="11.5" r="2.5"/><path d="M6 19v-3M18 19v-3"/>',
 sala:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
 parlantes:'<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14.5" r="3"/><circle cx="12" cy="7.5" r="1"/>',
 plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
 bars:'<path d="M5 20v-7M12 20V5M19 20v-10"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/>',

// ---- comunicación (Hoja de Google) o demostración local
async function remote(body){
  const r=body?await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}):await fetch(API+"?action=reservas");
  return r.json();
}
const LSK="aip_reservas_demo";
function localOp(o){
  let L;try{L=JSON.parse(lsGet(LSK))||{reservas:[]}}catch(e){L={reservas:[]}}
  const h=localHoy();let err=null;const uid=()=>Math.random().toString(36).slice(2,10);
  const ids=o.ids||[o.id];
  switch(o.action){
    case"reservarVarias":{err=validarVarias(L.reservas,o.rs,h);if(!err)o.rs.forEach(r=>L.reservas.push({...r,bloqueo:undefined,id:uid(),creado:new Date().toISOString()}))}break;
    case"cancelar":L.reservas=L.reservas.filter(x=>!(ids.includes(x.id)&&x.docente===o.docente));break;
    case"adminCheck":if(o.pin!==DEMO_PIN)err="PIN incorrecto";break;
    case"cancelarAdmin":if(o.pin!==DEMO_PIN)err="PIN incorrecto";else L.reservas=L.reservas.filter(x=>!ids.includes(x.id));break;
    case"bloquear":if(o.pin!==DEMO_PIN)err="PIN incorrecto";else{const p=planBloqueo(L.reservas,o,h);if(p.error)err=p.error;else p.rows.forEach(r=>L.reservas.push({...r,bloqueo:undefined,id:uid()}))}break;
  }
  lsSet(LSK,JSON.stringify(L));
  return{docentes:DOCENTES,reservas:L.reservas,hoy:h,error:err};
}
function apply(s){
  S={docentes:s.docentes&&s.docentes.length?s.docentes:DOCENTES,reservas:s.reservas||[],hoy:s.hoy||localHoy()};
  fillAreas();fillDocentes();render();
}
async function op(o){
  try{
    const s=mode==="remote"?await remote(o):localOp(o);
    if(s.reservas)apply(s);
    if(s.error){toast(s.error,1);return false}
    return true;
  }catch(e){toast("No se pudo conectar. Revise su internet e intente de nuevo",1);return false}
}
function setStatus(){
  $("#sync").textContent=mode==="remote"?"● En línea":"○ Demostración";
  const b=$("#demo");b.hidden=mode==="remote";
  b.textContent=API?"No hay conexión con la Hoja de Google. Las reservas de esta pantalla solo se guardan en este equipo (demostración).":"Modo demostración: las reservas solo se guardan en este equipo.";
}
async function pull(){
  if(!API){setStatus();return}
  try{
    let s=await remote();
    if(s.error)throw new Error(s.error);
    if(!s.docentes.length)s=await remote({action:"initDocentes",docentes:DOCENTES.map(d=>({nombre:d.nombre,area:d.area}))});
    mode="remote";apply(s);
  }catch(e){if(mode==="remote"){toast("Sin conexión. Reintentando…",1);mode="local"}}
  setStatus();
  if(mode==="local")apply(localOp({action:"nada"}));
}

// ---- solicitudes (reservas por hora agrupadas)
function solicitudes(){
  const l=[...S.reservas].sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.docente.localeCompare(b.docente)||a.hora-b.hora),out=[];
  l.forEach(r=>{const p=out[out.length-1],sig=ITEMS.map(k=>+r[k]).join();
    if(p&&p.docente===r.docente&&p.fecha===r.fecha&&p.sig===sig&&p.hf+1===+r.hora&&p.grado===r.grado&&p.nota===r.nota){p.hf=+r.hora;p.ids.push(r.id)}
    else out.push({docente:r.docente,area:r.area,fecha:r.fecha,sig,hi:+r.hora,hf:+r.hora,ids:[r.id],grado:r.grado,nota:r.nota,q:Object.fromEntries(ITEMS.map(k=>[k,+r[k]||0]))})});
  return out.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.hi-b.hi||a.docente.localeCompare(b.docente));
}
const esBloq=s=>s.docente==="BLOQUEO";
const horarioTxt=s=>{const d=diaIdx(s.fecha);return horaDe(d,s.hi).i+" – "+horaDe(d,s.hf).f};
const enSemana=(s,w)=>s.fecha>=w&&s.fecha<=addDays(w,4);

function fillSec(){const g=+$("#fGrado").value;$("#fSec").innerHTML=`<option value="">Seleccione sección...</option>`+(g?"ABCDE".slice(0,g===1?5:4).split("").map(s=>`<option>${s}</option>`).join(""):"");$("#fSec").disabled=!g}
const rango=()=>F.dia==null||!F.ini?null:{fecha:addDays(UI.semana,F.dia),de:F.ini,a:F.fin||F.ini};
function dispo(k){
  const r=rango();if(!r)return CAP[k];let m=CAP[k];
  for(let h=r.de;h<=r.a;h++)m=Math.min(m,CAP[k]-usoDe(S.reservas,r.fecha,h)[k]);return Math.max(0,m);
}
function renderRes(){
  $("#res").innerHTML=RORD.map(k=>{const d=dispo(k);if(F.q[k]>d)F.q[k]=d;const on=F.q[k]>0;
    return`<div class="rc ${on?"on":""} ${d===0?"off":""}" style="--rc:var(--c-${k})" data-k="${k}" role="button" tabindex="0" aria-pressed="${on}">
      ${ico(k)}<b>${NOM[k]}</b><small>${rango()?"Disponibles":"En total"}: ${k==="sala"?(d?"libre":"ocupada"):d}</small>
      ${on&&k!=="sala"?`<div class="stp"><button type="button" data-k="${k}" data-s="-1" aria-label="Menos">−</button><output>${F.q[k]}</output><button type="button" data-k="${k}" data-s="1" aria-label="Más">+</button></div>`:""}</div>`}).join("");
}

function renderHoras(){
  const ini=$("#hIni"),fin=$("#hFin");
  if(F.dia==null){ini.innerHTML=fin.innerHTML=`<option value="">Elija primero el día</option>`;ini.disabled=fin.disabled=true;return}
  ini.disabled=fin.disabled=false;
  const hs=HOR[F.dia].filter(b=>b.h),txt=b=>`${b.h}.ª hora · ${b.i}–${b.f}`;
  ini.innerHTML=`<option value="">Seleccione hora de inicio...</option>`+hs.map(b=>`<option value="${b.h}"${b.h===F.ini?" selected":""}>${txt(b)}</option>`).join("");

function weekChips(id){

}
async function registrar(){
  if(!UI.doc)return toast("Elija su nombre en la lista de docentes",1);
  if(!ITEMS.some(k=>F.q[k]>0))return toast("Elija al menos un recurso",1);
  if(F.dia==null)return toast("Elija el día",1);
  if(!F.ini)return toast("Elija la hora de inicio",1);
  const r=rango(),d=S.docentes.find(x=>x.nombre===UI.doc),g=$("#fGrado").value,s=$("#fSec").value,rs=[];
  for(let h=r.de;h<=r.a;h++)rs.push({fecha:r.fecha,hora:h,docente:UI.doc,area:d?d.area:"",laptops:F.q.laptops,parlantes:F.q.parlantes,proyectores:F.q.proyectores,sala:F.q.sala,grado:g?g+"° "+s:"—",nota:$("#fNota").value.trim()});
  if(await op({action:"reservarVarias",clave:$("#clave").value,rs})){toast("Reserva registrada");limpiar();UI.tab="lista";$("#qMias").checked=true;UI.page=1;render()}
}

function renderLista(){
  $("#hdLista").innerHTML=ico("check")+`<div><h2>Reservas registradas</h2><p>Listado de solicitudes de uso de recursos</p></div>`;
  if(!$("#qRes").options.length)$("#qRes").innerHTML=`<option value="">Todos los recursos</option>`+RORD.map(k=>`<option value="${k}">${NOM[k]}</option>`).join("");
  const q=$("#qBuscar").value.trim().toLowerCase(),rk=$("#qRes").value,mias=$("#qMias").checked,pas=$("#qPas").checked;
  const l=solicitudes().filter(s=>(pas||s.fecha>=hoy())&&(!mias||s.docente===UI.doc)&&(!rk||s.q[rk]>0)&&
    (!q||(s.docente+" "+(AREAS[s.area]||s.area)+" "+ITEMS.filter(k=>s.q[k]).map(k=>NOM[k]).join(" ")).toLowerCase().includes(q)));
  const per=8,pages=Math.max(1,Math.ceil(l.length/per));UI.page=Math.min(UI.page,pages);
  const vis=l.slice((UI.page-1)*per,UI.page*per);
  $("#tbody").innerHTML=vis.length?vis.map((s,i)=>{
    const bl=esBloq(s),pasado=s.fecha<hoy();
    const rec=bl?`<span class="rch">Todos los recursos</span>`:RORD.filter(k=>s.q[k]).map(k=>`<span class="rch" style="--rc:var(--c-${k})">${ico(k)} ${NOM[k]}${k==="sala"?"":" ×"+s.q[k]}</span>`).join("");
    const act=admin?`<button class="btn sec sm" data-anular="${s.ids.join(",")}">Anular</button>`:(!bl&&s.docente===UI.doc&&!pasado?`<button class="btn sec sm" data-cancel="${s.ids.join(",")}">Cancelar</button>`:"");
    return`<tr><td data-l="N.°">${(UI.page-1)*per+i+1}</td><td data-l="Fecha">${DIAS[diaIdx(s.fecha)]}, ${fdmy(s.fecha)}</td>
      <td data-l="Docente">${bl?"Coordinación AIP":esc(s.docente)}${!bl&&s.grado&&s.grado!=="—"?`<br><small>${esc(s.grado)}</small>`:""}</td>
      <td data-l="Área">${bl?"—":esc(AREAS[s.area]||s.area)}</td><td data-l="Recurso">${rec}</td><td data-l="Horario">${horarioTxt(s)}</td>
      <td data-l="Estado"><span class="tag ${bl?"b":pasado?"p":""}">${bl?"Bloqueado":pasado?"Realizada":"Confirmada"}</span>${bl&&s.nota?`<br><small>${esc(s.nota)}</small>`:""}</td><td>${act}</td></tr>`}).join(""):
    `<tr><td colspan="8" class="empty">No hay reservas para mostrar.</td></tr>`;
  $("#pgInfo").textContent=l.length?`Mostrando ${vis.length} de ${l.length} reservas`:"";

function conteoDias(w){return DIAS.map((_,i)=>solicitudes().filter(s=>!esBloq(s)&&s.fecha===addDays(w,i)).length)}

  weekChips("#weeksR");
  $("#hdResumen").innerHTML=ico("bars")+`<div><h2>Resumen de reservas</h2><p>Uso del Aula de Innovación Pedagógica</p></div>`;
  const all=solicitudes().filter(s=>!esBloq(s)),sem=all.filter(s=>enSemana(s,UI.semana));
  $("#stats").innerHTML=[["cal","Solicitudes registradas",all.length],["week","Reservas de la semana",sem.length],["users","Docentes que reservaron",new Set(all.map(s=>s.docente)).size]]
    .map(([i,t,n])=>`<div class="stat">${ico(i)}<div><span>${t}</span><b>${n}</b></div></div>`).join("");

  const u=RORD.map(k=>[k,sem.filter(s=>s.q[k]>0).length]),mu=Math.max(1,...u.map(x=>x[1]));
  $("#hbars").innerHTML=u.map(([k,n])=>`<div class="hb" style="--rc:var(--c-${k})"><span>${ico(k)} ${NOM[k]}</span><div class="tr"><i style="width:${n/mu*100}%"></i></div><b>${n}</b></div>`).join("");

$("#hIni").onchange=e=>{F.ini=+e.target.value;if(!F.fin||F.fin<F.ini)F.fin=F.ini;renderHoras();renderRes();renderAviso()};
$("#hFin").onchange=e=>{F.fin=+e.target.value||F.ini;renderRes();renderAviso()};
for(const id of["#weeksN","#weeksR"])$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;UI.semana=b.dataset.w;if(F.dia!=null&&addDays(UI.semana,F.dia)<hoy())F.dia=null,F.ini=F.fin=0;render()};
$("#btnReg").onclick=registrar;$("#btnLimpiar").onclick=limpiar;
["#qBuscar","#qRes","#qMias","#qPas"].forEach(s=>$(s).oninput=()=>{UI.page=1;renderLista()});
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.pg){UI.page=+t.dataset.pg;renderLista()}
  else if(t.dataset.cancel){if(await ask("Cancelar reserva","¿Seguro que desea cancelar esta reserva?")&&await op({action:"cancelar",ids:t.dataset.cancel.split(","),docente:UI.doc,clave:$("#clave").value}))toast("Reserva cancelada")}
  else if(t.dataset.anular){if(await ask("Anular reserva","¿Anular esta reserva?")&&await op({action:"cancelarAdmin",pin:admin,ids:t.dataset.anular.split(",")}))toast("Reserva anulada")}
});
$("#btnCoord").onclick=()=>{if(admin){admin=null;render();toast("Sesión de coordinación cerrada")}else{$("#pin").value="";$("#dlgPin").showModal()}};
$("#pinNo").onclick=()=>$("#dlgPin").close();
$("#pinOk").onclick=async()=>{const p=$("#pin").value;if(await op({action:"adminCheck",pin:p})){admin=p;$("#dlgPin").close();UI.tab="lista";render();toast("Acceso de coordinación activo")}};
$("#btnBloqAbrir").onclick=()=>{
  $("#bDia").innerHTML=DIAS.map((n,i)=>{const f=addDays(UI.semana||semanaBase(hoy()),i);return`<option value="${f}">${n} ${fcorta(f)}</option>`}).join("");
  const hs=[1,2,3,4,5,6,7].map(h=>`<option value="${h}">${h}.ª hora</option>`).join("");$("#bDesde").innerHTML=$("#bHasta").innerHTML=hs;$("#bHasta").value="7";$("#bMot").value="";$("#dlgBloq").showModal()};
$("#bNo").onclick=()=>$("#dlgBloq").close();
$("#bOk").onclick=async()=>{const d=+$("#bDesde").value,h=+$("#bHasta").value;if(h<d)return toast("La hora final debe ser igual o mayor que la inicial",1);
  if(await op({action:"bloquear",pin:admin,fecha:$("#bDia").value,desde:d,hasta:h,motivo:$("#bMot").value.trim()})){$("#dlgBloq").close();toast("Horario bloqueado")}};

fillGrados();fillAreas();fillDocentes();UI.semana=semanaBase(hoy());render();pull().then(()=>setInterval(pull,30000));
</script>
</body>
</html>
